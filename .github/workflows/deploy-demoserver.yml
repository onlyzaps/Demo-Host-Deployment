name: Deploy DemoServer

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy:
    name: Build & Deploy DemoServer Container
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        working-directory: ./DemoServer
        run: |
          # Stop existing container if it's running
          docker compose down
          
          # Rebuild and start the container as a daemon
          docker compose up -d --build
