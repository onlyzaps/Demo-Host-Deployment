<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2MapBuddy Demos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ffaa00; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #1e1e1e; color: #ffaa00; }
        tr:hover { background-color: #2a2a2a; }
        a { color: #4facfe; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>CS2MapBuddy - Match Demos</h1>
    <div style="max-width: 900px; margin: auto;">
        <table>
            <thead>
                <tr>
                    <th>Folder (UTC Date)</th>
                    <th>FileName</th>
                    <th>Size</th>
                    <th>Date</th>
                    <th>Download</th>
                </tr>
            </thead>
            <tbody id="demo-list">
                <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        fetch('/api/demos')
            .then(res => res.json())
            .then(demos => {
                const tbody = document.getElementById('demo-list');
                tbody.innerHTML = '';
                if(demos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No demos found.</td></tr>';
                    return;
                }
                demos.forEach(demo => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${demo.folder}</td>
                        <td>${demo.name}</td>
                        <td>${demo.size}</td>
                        <td>${new Date(demo.date).toLocaleString()}</td>
                        <td><a href="/demos/${demo.path}" download>Download</a></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                document.getElementById('demo-list').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Failed to load demos.</td></tr>';
            });
    </script>
</body>
</html>
